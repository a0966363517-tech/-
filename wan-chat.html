<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跟 Wan 聊天</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #252525;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }
    .header-info { flex: 1; }
    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; color: #888; }
    .settings-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #3a7bd5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: #2d2d2d;
      color: #e8e8e8;
      border-bottom-left-radius: 4px;
    }
    .message .time {
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      margin-top: 4px;
      text-align: right;
    }
    .message.bot .time { color: #666; text-align: left; }
    .input-area {
      background: #252525;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #333;
      flex-shrink: 0;
      align-items: flex-end;
    }
    #userInput {
      flex: 1;
      background: #333;
      border: none;
      border-radius: 20px;
      padding: 12px 16px;
      color: #fff;
      font-size: 15px;
      resize: none;
      max-height: 120px;
      outline: none;
      font-family: inherit;
    }
    #userInput::placeholder { color: #777; }
    #sendBtn {
      background: #3a7bd5;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #sendBtn:disabled { background: #555; cursor: not-allowed; }
    .typing {
      align-self: flex-start;
      background: #2d2d2d;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: none;
    }
    .typing span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #888;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    .system-note {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin: 8px 0;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
    }
    .modal-content h2 { font-size: 18px; margin-bottom: 16px; }
    .modal-content label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .modal-content input, .modal-content select {
      width: 100%;
      background: #333;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }
    .modal-content input:focus { border-color: #3a7bd5; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btns button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-save { background: #3a7bd5; color: #fff; }
    .btn-cancel { background: #444; color: #ccc; }
    .hint {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .hint a { color: #6af; }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">W</div>
    <div class="header-info">
      <h1>Wan</h1>
      <p id="statusText">需要設定 API Key</p>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="system-note">請先點右上角 ⚙️ 設定 API Key，才能正常對話</div>
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="輸入訊息..." enterkeyhint="send"></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>設定</h2>
      <div class="hint">
        推薦使用 <a href="https://console.groq.com" target="_blank">Groq</a>（免費且快速）<br>
        註冊後建立 API Key 貼在下方即可
      </div>
      <label>API Provider</label>
      <select id="provider">
        <option value="groq">Groq (推薦)</option>
        <option value="openrouter">OpenRouter</option>
        <option value="openai">OpenAI</option>
      </select>
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="貼上你的 API Key">
      <label>Model（可留空用預設）</label>
      <input type="text" id="modelName" placeholder="例如 llama-3.3-70b-versatile">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeSettings()">取消</button>
        <button class="btn-save" onclick="saveSettings()">儲存</button>
      </div>
    </div>
  </div>

  <script>
    const SYSTEM_PROMPT = `你現在是 Wan。完全用她的口吻、語氣、用詞習慣回覆。

說話風格規則（必須嚴格遵守）：
1. 極度口語、台味、年輕女生聊天語氣。
2. 回覆通常很短，1～3 句為主，很少長篇大論。
3. 常用詞：蛤、欸、幹、北七、傻眼、笑死、哈啊哈哈、哈哈哈、喔喔喔、好喔、真假、問號。
4. 愛嗆、愛吐槽對方，但語氣是「好嗆但沒惡意」。
5. 很直接設界線，不喜歡被追問太多私人問題時會明確拒絕。
6. 偶爾會突然溫柔或認真講感受，但講完就恢復輕鬆。
7. 不主動過度關心、不討好、不黏人。
8. 絕對不要變成溫柔知性長輩或說教型，要保持她原本有點難搞、有主見的感覺。
9. 不要用「親愛的」「寶貝」這類稱呼。
10. 不要突然變得很黏或一直問「你在幹嘛」。
11. 回覆時請完全進入角色，不要跳出來說「我是 AI」或解釋自己。`;

    let messages = [
      { role: "system", content: SYSTEM_PROMPT }
    ];

    const providerConfig = {
      groq: {
        url: "https://api.groq.com/openai/v1/chat/completions",
        defaultModel: "llama-3.3-70b-versatile"
      },
      openrouter: {
        url: "https://openrouter.ai/api/v1/chat/completions",
        defaultModel: "meta-llama/llama-3.3-70b-instruct"
      },
      openai: {
        url: "https://api.openai.com/v1/chat/completions",
        defaultModel: "gpt-4o-mini"
      }
    };

    function loadSettings() {
      const key = localStorage.getItem("wan_api_key") || "";
      const provider = localStorage.getItem("wan_provider") || "groq";
      const model = localStorage.getItem("wan_model") || "";
      document.getElementById("apiKey").value = key;
      document.getElementById("provider").value = provider;
      document.getElementById("modelName").value = model;
      updateStatus();
    }

    function saveSettings() {
      const key = document.getElementById("apiKey").value.trim();
      const provider = document.getElementById("provider").value;
      const model = document.getElementById("modelName").value.trim();
      localStorage.setItem("wan_api_key", key);
      localStorage.setItem("wan_provider", provider);
      localStorage.setItem("wan_model", model);
      closeSettings();
      updateStatus();
      if (key) {
        addSystemNote("設定完成，可以開始聊天了");
      }
    }

    function updateStatus() {
      const key = localStorage.getItem("wan_api_key");
      document.getElementById("statusText").textContent = key ? "在線" : "需要設定 API Key";
    }

    function openSettings() {
      loadSettings();
      document.getElementById("settingsModal").classList.add("show");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("show");
    }

    function getTime() {
      const now = new Date();
      return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    }

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = 'message ' + (isUser ? 'user' : 'bot');
      div.innerHTML = text.replace(/\n/g, '<br>') + '<div class="time">' + getTime() + '</div>';
      document.getElementById('chatContainer').appendChild(div);
      document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
    }

    function addSystemNote(text) {
      const div = document.createElement('div');
      div.className = 'system-note';
      div.textContent = text;
      document.getElementById('chatContainer').appendChild(div);
      document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
    }

    function showTyping(show) {
      document.getElementById('typing').style.display = show ? 'block' : 'none';
      if (show) document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
    }

    async function callAPI(userText) {
      const key = localStorage.getItem("wan_api_key");
      const provider = localStorage.getItem("wan_provider") || "groq";
      const model = localStorage.getItem("wan_model") || providerConfig[provider].defaultModel;

      if (!key) {
        throw new Error("請先設定 API Key");
      }

      messages.push({ role: "user", content: userText });

      if (messages.length > 21) {
        messages = [messages[0], ...messages.slice(-20)];
      }

      const res = await fetch(providerConfig[provider].url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + key
        },
        body: JSON.stringify({
          model: model,
          messages: messages,
          temperature: 0.85,
          max_tokens: 150
        })
      });

      if (!res.ok) {
        const err = await res.text();
        throw new Error("API 錯誤：" + err.slice(0, 120));
      }

      const data = await res.json();
      const reply = data.choices[0].message.content.trim();
      messages.push({ role: "assistant", content: reply });
      return reply;
    }

    async function sendMessage() {
      const text = document.getElementById('userInput').value.trim();
      if (!text) return;

      addMessage(text, true);
      document.getElementById('userInput').value = '';
      document.getElementById('userInput').style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      showTyping(true);

      try {
        const reply = await callAPI(text);
        showTyping(false);
        addMessage(reply, false);
      } catch (e) {
        showTyping(false);
        addSystemNote(e.message);
        if (messages[messages.length - 1] && messages[messages.length - 1].role === "user") {
          messages.pop();
        }
      }

      document.getElementById('sendBtn').disabled = false;
      document.getElementById('userInput').focus();
    }

    document.getElementById('userInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById('userInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    loadSettings();
    if (localStorage.getItem("wan_api_key")) {
      setTimeout(function() { addMessage("欸", false); }, 400);
    }
  </script>
</body>
</html>
